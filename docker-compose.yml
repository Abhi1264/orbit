name: orbit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: probelens
      POSTGRES_PASSWORD: probelens
      POSTGRES_DB: probelens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probelens -d probelens"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: probelens
      CLICKHOUSE_USER: probelens
      CLICKHOUSE_PASSWORD: probelens
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d/probelens.xml:/etc/clickhouse-server/config.d/probelens.xml:ro
      - ./infra/clickhouse/users.d/probelens.xml:/etc/clickhouse-server/users.d/probelens.xml:ro
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://probelens:probelens@postgres:5432/probelens
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_READONLY_USER: probelens_ro
      CLICKHOUSE_READONLY_PASSWORD: probelens_ro
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    command: ["uvicorn", "probelens.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://probelens:probelens@postgres:5432/probelens
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_READONLY_USER: probelens_ro
      CLICKHOUSE_READONLY_PASSWORD: probelens_ro
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, redis; assert redis.from_url(os.environ['REDIS_URL']).get('orbit:worker:heartbeat')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    command: ["python", "-m", "probelens.worker"]

  seed:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://probelens:probelens@postgres:5432/probelens
      CLICKHOUSE_HOST: clickhouse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    profiles: ["seed"]
    command: ["python", "-m", "probelens.seed", "--profile", "${SEED_PROFILE:-demo}", "--seed", "${SEED:-42}"]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  postgres_data:
  clickhouse_data:
