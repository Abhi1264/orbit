[project]
name = "probelens-api"
version = "0.1.0"
description = "Probelens API, worker and seed generator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "clickhouse-connect>=0.8",
    "redis>=5.0",
    "dramatiq[redis]>=1.17",
    "apscheduler>=3.10,<4",
    "structlog>=24.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "openai>=1.50",
    "numpy>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["probelens"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Seed content is prose; long strings are more readable than wrapped ones.
"probelens/seed/*" = ["E501"]
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
